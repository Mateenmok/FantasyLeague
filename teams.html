<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <title>League Info | PokeLeague</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/pokemon-ui.css?v=global-black-dark1">

  <style>
    body.teams-theme-page {
      margin: 0;
      min-height: 100vh;
      background-color: #191a1d;
      background-image:
        linear-gradient(rgba(20, 21, 24, 0.84), rgba(19, 20, 23, 0.90)),
        url("images/backgrounds/VictoryRoad.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #f4f5f7;
      font-family: "Oxanium", Arial, sans-serif;
    }

    .teams-theme-overlay {
      min-height: 100vh;
      padding: 32px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.04), transparent 32%),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.14), rgba(0, 0, 0, 0.38));
      box-sizing: border-box;
    }

    .teams-theme-card {
      width: min(1180px, 94vw);
      padding: 22px;
      border-radius: 7px;
      background:
        linear-gradient(145deg, rgba(31, 33, 38, 0.95), rgba(9, 10, 13, 0.96));
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 18px 48px rgba(0, 0, 0, 0.42);
      box-sizing: border-box;
    }

    .teams-theme-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      padding-bottom: 18px;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .teams-kicker {
      display: block;
      margin-bottom: 5px;
      color: rgba(255, 223, 128, 0.84);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .teams-theme-title {
      margin: 0;
      font-family: "Oxanium", Arial, sans-serif;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 14px rgba(255, 223, 128, 0.18);
    }

    #teamInfoSubtitle {
      margin: 8px 0 0;
      font-family: "Oxanium", Arial, sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: rgba(255, 255, 255, 0.72);
      text-shadow: none;
    }

    .teams-theme-links {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .teams-theme-link,
    body.teams-theme-page .view-profile-button,
    body.teams-theme-page .save-team-button {
      min-height: 42px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      text-decoration: none;
      border-radius: 7px;
      background: linear-gradient(to bottom, #f0d786, #b9852f);
      border: 1px solid rgba(255, 255, 255, 0.32);
      color: #17181a;
      font-family: "Oxanium", Arial, sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      text-shadow: none;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.52),
        0 8px 18px rgba(0, 0, 0, 0.24);
      transition: transform 0.12s ease, filter 0.12s ease;
      box-sizing: border-box;
      cursor: pointer;
    }

    .teams-theme-link.light,
    body.teams-theme-page .view-profile-button {
      background: linear-gradient(to bottom, rgba(245, 246, 248, 0.94), rgba(199, 203, 210, 0.90));
      color: #202226;
    }

    .teams-theme-link:hover,
    body.teams-theme-page .view-profile-button:hover,
    body.teams-theme-page .save-team-button:hover {
      transform: translateY(-1px);
      filter: brightness(1.06);
    }

    .league-info-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .league-info-stat {
      min-width: 0;
      padding: 12px;
      border-radius: 7px;
      background: linear-gradient(145deg, rgba(37, 39, 45, 0.96), rgba(15, 16, 20, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.07),
        0 8px 18px rgba(0, 0, 0, 0.22);
    }

    .league-info-stat span {
      display: block;
      margin-bottom: 4px;
      color: rgba(255, 255, 255, 0.56);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .league-info-stat strong {
      display: block;
      overflow: hidden;
      color: #ffffff;
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #teamInfoGrid.team-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
      align-items: stretch;
      margin-top: 0;
    }

    body.teams-theme-page .team-info-card,
    body.teams-theme-page .empty-state {
      position: relative;
      min-width: 0;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto auto auto;
      gap: 0;
      height: 100%;
      padding: 0;
      border-radius: 7px;
      background:
        linear-gradient(180deg, rgba(35, 37, 43, 0.98), rgba(11, 12, 15, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 12px 26px rgba(0, 0, 0, 0.32);
      color: #ffffff;
      font-family: "Oxanium", Arial, sans-serif;
      box-sizing: border-box;
    }

    body.teams-theme-page .team-info-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: linear-gradient(to bottom, #f0d786, #8fa0ad);
      opacity: 0.82;
      pointer-events: none;
    }

    body.teams-theme-page .team-info-top {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
      min-height: 150px;
      padding: 16px 16px 12px;
      min-width: 0;
      box-sizing: border-box;
    }

    body.teams-theme-page .team-portrait-pair {
      position: relative;
      width: 112px;
      height: 92px;
    }

    body.teams-theme-page .team-info-logo,
    body.teams-theme-page .team-info-logo-placeholder,
    body.teams-theme-page .team-profile-avatar,
    body.teams-theme-page .team-profile-avatar-placeholder {
      display: grid;
      place-items: center;
      box-sizing: border-box;
      object-fit: cover;
      color: #202226;
      font-weight: 900;
      text-shadow: none;
      background: linear-gradient(145deg, rgba(246, 247, 248, 0.96), rgba(205, 209, 216, 0.92));
      border: 2px solid rgba(255, 255, 255, 0.58);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.58),
        0 10px 18px rgba(0, 0, 0, 0.30);
    }

    body.teams-theme-page .team-info-logo,
    body.teams-theme-page .team-info-logo-placeholder {
      position: absolute;
      top: 0;
      right: 0;
      width: 72px !important;
      height: 72px !important;
      min-width: 72px !important;
      min-height: 72px !important;
      padding: 6px;
      border-radius: 7px;
      font-size: 22px;
      object-fit: contain;
    }

    body.teams-theme-page .team-profile-avatar,
    body.teams-theme-page .team-profile-avatar-placeholder {
      position: absolute;
      left: 0;
      bottom: 0;
      z-index: 2;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      font-size: 20px;
      object-fit: cover;
    }

    body.teams-theme-page .team-info-main {
      min-width: 0;
    }

    body.teams-theme-page .team-card-kicker {
      display: block;
      margin-bottom: 5px;
      color: rgba(255, 255, 255, 0.52);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    body.teams-theme-page .team-info-main h2 {
      margin: 0;
      overflow: hidden;
      min-height: 50px;
      color: #ffffff;
      font-family: "Oxanium", Arial, sans-serif;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0.4px;
      line-height: 1.04;
      text-shadow: 0 0 12px rgba(255, 223, 128, 0.14);
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    body.teams-theme-page .team-owner-line {
      margin: 6px 0 0;
      overflow: hidden;
      color: rgba(255, 255, 255, 0.70);
      font-size: 13px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    body.teams-theme-page .team-info-main p,
    body.teams-theme-page .empty-state p {
      margin: 0;
      font-family: "Oxanium", Arial, sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.72);
    }

    body.teams-theme-page .team-info-main strong {
      color: #ffffff;
      font-weight: 900;
    }

    body.teams-theme-page .team-card-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-content: flex-start;
      align-items: flex-start;
      min-height: 54px;
      margin-top: 10px;
    }

    body.teams-theme-page .admin-badge,
    body.teams-theme-page .team-role-badge,
    body.teams-theme-page .division-badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      max-width: 100%;
      padding: 0 9px;
      border-radius: 999px;
      overflow: hidden;
      font-family: "Oxanium", Arial, sans-serif;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-overflow: ellipsis;
      text-transform: uppercase;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    body.teams-theme-page .admin-badge {
      background: rgba(240, 215, 134, 0.22);
      color: #f7df8d;
    }

    body.teams-theme-page .team-role-badge {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.82);
    }

    body.teams-theme-page .division-badge {
      background: rgba(143, 160, 173, 0.18);
      color: rgba(227, 232, 236, 0.88);
    }

    body.teams-theme-page .team-info-meta-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 0 16px 14px;
    }

    body.teams-theme-page .team-info-meta-grid > div {
      min-width: 0;
      padding: 10px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    body.teams-theme-page .team-info-meta-grid span {
      display: block;
      margin-bottom: 5px;
      color: rgba(255, 255, 255, 0.48);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    body.teams-theme-page .team-info-meta-grid strong {
      display: block;
      overflow: hidden;
      color: rgba(255, 255, 255, 0.92);
      font-size: 14px;
      font-weight: 900;
      line-height: 1.08;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    body.teams-theme-page .team-card-actions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 0 16px 16px;
    }

    body.teams-theme-page .small-note,
    body.teams-theme-page .team-manager-email {
      color: rgba(255, 255, 255, 0.56);
      font-family: "Oxanium", Arial, sans-serif;
      font-size: 12px;
      font-weight: 800;
    }

    body.teams-theme-page .team-manager-email {
      overflow: hidden;
      padding: 0 16px 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    body.teams-theme-page .team-admin-editor {
      margin: 0 16px 16px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.10);
    }

    body.teams-theme-page .team-admin-editor summary {
      min-height: 42px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      color: rgba(255, 255, 255, 0.84);
      cursor: pointer;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    body.teams-theme-page .team-edit-form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 10px;
      padding: 0 12px 12px;
    }

    body.teams-theme-page .team-edit-field {
      min-width: 0;
      display: grid;
      gap: 5px;
    }

    body.teams-theme-page .team-edit-field.wide,
    body.teams-theme-page .save-team-button {
      grid-column: 1 / -1;
    }

    body.teams-theme-page .team-edit-form label {
      color: rgba(255, 255, 255, 0.62);
      font-family: "Oxanium", Arial, sans-serif;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      text-shadow: none;
    }

    body.teams-theme-page .team-edit-form input {
      width: 100%;
      min-height: 38px;
      padding: 9px 10px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.10);
      color: #ffffff;
      font-family: "Oxanium", Arial, sans-serif;
      font-size: 13px;
      font-weight: 800;
      outline: none;
      box-sizing: border-box;
      box-shadow: none;
    }

    body.teams-theme-page .team-edit-form input:focus {
      border-color: rgba(240, 215, 134, 0.68);
      box-shadow: 0 0 0 3px rgba(240, 215, 134, 0.14);
    }

    body.teams-theme-page .save-team-button {
      width: 100%;
      margin-top: 4px;
      border: 0;
    }

    #teamInfoStatus {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 7px;
      background: rgba(0, 0, 0, 0.48);
      border: 1px solid rgba(255, 255, 255, 0.20);
      text-align: center;
      font-family: "Oxanium", Arial, sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.90);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 8px 20px rgba(0, 0, 0, 0.22);
    }

    body.league-light-mode.teams-theme-page {
      background-color: #ededee;
      background-image:
        linear-gradient(rgba(244, 245, 246, 0.76), rgba(224, 226, 229, 0.82)),
        url("images/backgrounds/VictoryRoad.png") !important;
    }

    body.league-light-mode.teams-theme-page .teams-theme-overlay {
      background:
        radial-gradient(circle at 20% 10%, rgba(240, 215, 134, 0.16), transparent 28%),
        linear-gradient(135deg, rgba(215, 218, 223, 0.76), rgba(186, 190, 198, 0.70) 52%, rgba(162, 167, 176, 0.74)) !important;
    }

    body.league-light-mode.teams-theme-page .teams-theme-card,
    body.league-light-mode.teams-theme-page .team-info-card,
    body.league-light-mode.teams-theme-page .league-info-stat,
    body.league-light-mode.teams-theme-page .empty-state {
      background:
        linear-gradient(145deg, rgba(250, 251, 252, 0.94), rgba(222, 224, 228, 0.92) 58%, rgba(238, 239, 241, 0.94)) !important;
      border-color: rgba(255, 255, 255, 0.86) !important;
      color: #26282c !important;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.76),
        0 12px 28px rgba(92, 96, 104, 0.20) !important;
    }

    body.league-light-mode.teams-theme-page .teams-theme-card {
      background:
        linear-gradient(145deg, rgba(219, 222, 227, 0.82), rgba(183, 188, 197, 0.76) 58%, rgba(205, 209, 216, 0.80)),
        radial-gradient(circle at 88% 0%, rgba(255, 255, 255, 0.26), transparent 34%) !important;
      border-color: rgba(255, 255, 255, 0.52) !important;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.48),
        0 18px 46px rgba(61, 66, 76, 0.24) !important;
    }

    body.league-light-mode.teams-theme-page .league-info-stat,
    body.league-light-mode.teams-theme-page .team-info-card,
    body.league-light-mode.teams-theme-page .empty-state {
      background:
        linear-gradient(145deg, rgba(244, 245, 247, 0.90), rgba(213, 216, 222, 0.88) 62%, rgba(232, 234, 238, 0.90)) !important;
    }

    body.league-light-mode.teams-theme-page .teams-theme-header {
      border-bottom-color: rgba(78, 82, 90, 0.14);
    }

    body.league-light-mode.teams-theme-page .teams-theme-title,
    body.league-light-mode.teams-theme-page .team-info-main h2,
    body.league-light-mode.teams-theme-page .league-info-stat strong,
    body.league-light-mode.teams-theme-page .team-info-meta-grid strong {
      color: #25272b !important;
      text-shadow:
        0 1px 0 rgba(255, 255, 255, 0.86),
        0 0 12px rgba(120, 124, 132, 0.18) !important;
    }

    body.league-light-mode.teams-theme-page #teamInfoSubtitle,
    body.league-light-mode.teams-theme-page .team-owner-line,
    body.league-light-mode.teams-theme-page .team-info-main p,
    body.league-light-mode.teams-theme-page .team-card-kicker,
    body.league-light-mode.teams-theme-page .league-info-stat span,
    body.league-light-mode.teams-theme-page .team-info-meta-grid span,
    body.league-light-mode.teams-theme-page .team-manager-email,
    body.league-light-mode.teams-theme-page .small-note,
    body.league-light-mode.teams-theme-page .team-admin-editor summary,
    body.league-light-mode.teams-theme-page .team-edit-form label {
      color: rgba(38, 40, 44, 0.68) !important;
      text-shadow: none !important;
    }

    body.league-light-mode.teams-theme-page .team-info-meta-grid > div,
    body.league-light-mode.teams-theme-page .team-admin-editor,
    body.league-light-mode.teams-theme-page .team-edit-form input {
      background: rgba(255, 255, 255, 0.46) !important;
      border-color: rgba(78, 82, 90, 0.16) !important;
      color: #25272b !important;
    }

    body.league-light-mode.teams-theme-page .team-role-badge,
    body.league-light-mode.teams-theme-page .division-badge {
      background: rgba(38, 40, 44, 0.07) !important;
      border-color: rgba(38, 40, 44, 0.12) !important;
      color: rgba(38, 40, 44, 0.72) !important;
    }

    body.league-light-mode.teams-theme-page .admin-badge {
      background: rgba(185, 133, 47, 0.16) !important;
      border-color: rgba(185, 133, 47, 0.22) !important;
      color: #7c541a !important;
    }

    body.league-light-mode.teams-theme-page #teamInfoStatus {
      background: rgba(255, 255, 255, 0.70) !important;
      border-color: rgba(78, 82, 90, 0.18) !important;
      color: #25272b !important;
    }

    body.league-light-mode.teams-theme-page {
      background-color: #c8cdd4 !important;
      background-image:
        linear-gradient(rgba(238, 241, 245, 0.34), rgba(134, 142, 153, 0.30)),
        url("images/backgrounds/VictoryRoad.png") !important;
      background-position: center !important;
      background-size: cover !important;
      background-attachment: fixed !important;
    }

    body.league-light-mode.teams-theme-page .teams-theme-overlay {
      background:
        radial-gradient(circle at 18% 0%, rgba(255, 238, 176, 0.20), transparent 30%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.22), rgba(210, 216, 225, 0.18) 48%, rgba(78, 86, 98, 0.14)) !important;
    }

    body.league-light-mode.teams-theme-page .teams-theme-card {
      background:
        linear-gradient(145deg, rgba(248, 250, 252, 0.76), rgba(205, 212, 222, 0.64)) !important;
      border-color: rgba(255, 255, 255, 0.64) !important;
      color: #23262b !important;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.58),
        0 20px 52px rgba(44, 50, 60, 0.24) !important;
      backdrop-filter: blur(3px) saturate(1.08) !important;
    }

    body.league-light-mode.teams-theme-page .teams-theme-header {
      border-bottom-color: rgba(35, 38, 43, 0.14) !important;
    }

    body.league-light-mode.teams-theme-page .teams-kicker {
      color: #8a651f !important;
      text-shadow: none !important;
    }

    body.league-light-mode.teams-theme-page .teams-theme-title {
      color: #23262b !important;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.56) !important;
    }

    body.league-light-mode.teams-theme-page #teamInfoSubtitle {
      color: rgba(35, 38, 43, 0.68) !important;
      text-shadow: none !important;
    }

    body.league-light-mode.teams-theme-page .league-info-stat,
    body.league-light-mode.teams-theme-page .team-info-card,
    body.league-light-mode.teams-theme-page .empty-state {
      background:
        linear-gradient(145deg, rgba(232, 235, 239, 0.88), rgba(188, 194, 203, 0.82) 64%, rgba(216, 220, 226, 0.86)) !important;
      border-color: rgba(255, 255, 255, 0.46) !important;
      color: #23262b !important;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.54),

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/webp" href="images/favicon.webp">
  <title>PokeLeague | Access</title>
  <meta name="description" content="Enter PokeLeague Season 1 and open the waiver wire.">
  <meta property="og:title" content="PokeLeague">
  <meta property="og:description" content="Enter PokeLeague Season 1 and open the waiver wire.">
  <meta property="og:image" content="https://www.pokeleague.org/images/og.png">
  <meta property="og:url" content="https://www.pokeleague.org/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PokeLeague">
  <meta name="twitter:description" content="Enter PokeLeague Season 1 and open the waiver wire.">
  <meta name="twitter:image" content="https://www.pokeleague.org/images/og.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+25&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/landing-access.css?v=figma-v2-7">
</head>
<body class="access-page">
  <main class="landing-viewport">
    <div class="landing-canvas" aria-labelledby="landingTitle">
      <figure class="poster poster-heliopt" aria-hidden="true"><img src="images/posters/heliopt-heliolisk.jpg" alt=""></figure>
      <figure class="poster poster-infinity" aria-hidden="true"><img src="images/posters/infinity-aegislash.jpg" alt=""></figure>
      <figure class="poster poster-grim-shady" aria-hidden="true"><img src="images/posters/grim-shady-sableye.jpg" alt=""></figure>
      <figure class="poster poster-freemont" aria-hidden="true"><img src="images/posters/freemont-ash-greninja.jpg" alt=""></figure>
      <figure class="poster poster-nine-points" aria-hidden="true"><img src="images/posters/nine-points-incineroar.jpg" alt=""></figure>
      <figure class="poster poster-mcky" aria-hidden="true"><img src="images/posters/micky-maushold.jpg" alt=""></figure>
      <figure class="poster poster-pokopia" aria-hidden="true"><img src="images/posters/pokopia-froslass.jpg" alt=""></figure>
      <figure class="poster poster-pick-me" aria-hidden="true"><img src="images/posters/pick-me-whimsicott.jpg" alt=""></figure>
      <figure class="poster poster-leaky-p" aria-hidden="true"><img src="images/posters/leaky-p-goodra.jpg" alt=""></figure>
      <figure class="poster poster-hawktuey" aria-hidden="true"><img src="images/posters/hawktuey-decidueye.jpg" alt=""></figure>
      <figure class="poster poster-asta" aria-hidden="true"><img src="images/posters/asta-paldean-tauros.jpg" alt=""></figure>
      <figure class="poster poster-lil-fear" aria-hidden="true"><img src="images/posters/lil-fear-mega-gengar.jpg" alt=""></figure>

      <section class="access-region" aria-label="PokeLeague access">
        <img class="access-art" src="images/landing/access-panel-figma.jpg" alt="" aria-hidden="true">
        <div class="access-wordmark-interaction" aria-hidden="true">
          <img class="access-wordmark-accent" src="images/landing/access-wordmark-accent.png" alt="">
        </div>
        <h1 id="landingTitle" class="access-title">PokeLeague</h1>
        <p class="access-season">Season 1</p>

        <form class="access-form" action="home.html">
          <label class="visually-hidden" for="accessCodeInput">Access Code</label>
          <input
            id="accessCodeInput"
            type="text"
            placeholder="Access Code"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
          >
          <button type="submit">Enter League</button>
        </form>
      </section>
    </div>
  </main>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <title>PokeLeague | Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+25&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/landing-access.css?v=figma-v2-7">
</head>
<body class="access-page">
  <main class="landing-viewport">
    <div class="landing-canvas" aria-labelledby="landingTitle">
      <figure class="poster poster-heliopt" aria-hidden="true"><img src="images/posters/heliopt-heliolisk.png" alt=""></figure>
      <figure class="poster poster-infinity" aria-hidden="true"><img src="images/posters/infinity-aegislash.png" alt=""></figure>
      <figure class="poster poster-grim-shady" aria-hidden="true"><img src="images/posters/grim-shady-sableye.png" alt=""></figure>
      <figure class="poster poster-freemont" aria-hidden="true"><img src="images/posters/freemont-ash-greninja.png" alt=""></figure>
      <figure class="poster poster-nine-points" aria-hidden="true"><img src="images/posters/nine-points-incineroar.png" alt=""></figure>
      <figure class="poster poster-mcky" aria-hidden="true"><img src="images/posters/micky-maushold.png" alt=""></figure>
      <figure class="poster poster-pokopia" aria-hidden="true"><img src="images/posters/pokopia-froslass.png" alt=""></figure>
      <figure class="poster poster-pick-me" aria-hidden="true"><img src="images/posters/pick-me-whimsicott.png" alt=""></figure>
      <figure class="poster poster-leaky-p" aria-hidden="true"><img src="images/posters/leaky-p-goodra.png" alt=""></figure>
      <figure class="poster poster-hawktuey" aria-hidden="true"><img src="images/posters/hawktuey-decidueye.png" alt=""></figure>
      <figure class="poster poster-asta" aria-hidden="true"><img src="images/posters/asta-paldean-tauros.png" alt=""></figure>
      <figure class="poster poster-lil-fear" aria-hidden="true"><img src="images/posters/lil-fear-mega-gengar.png" alt=""></figure>

      <section class="access-region" aria-label="PokeLeague access">
        <img class="access-art" src="images/landing/access-panel-figma.png" alt="" aria-hidden="true">
        <div class="access-wordmark-interaction" aria-hidden="true">
          <img class="access-wordmark-accent" src="images/landing/access-wordmark-accent.png" alt="">
        </div>
        <h1 id="landingTitle" class="access-title">PokeLeague</h1>
        <p class="access-season">Season 1</p>

        <div class="access-form">
          <label class="visually-hidden" for="accessCodeInput">Access Code</label>
          <input
            id="accessCodeInput"
            name="accessCode"
            type="text"
            placeholder="Access Code"
            autocomplete="off"
            autocapitalize="none"
            spellcheck="false"
          >
          <button type="button">Enter League</button>
        </div>
      </section>
    </div>
  </main>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <title>Public Leagues | PokeLeague</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/pokemon-ui.css?v=global-black-dark1">

  <style>
    body.public-leagues-theme-page {
      margin: 0;
      min-height: 100vh;
      background-image: url("images/backgrounds/VictoryRoad.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #ffffff;
      font-family: "Oxanium", Arial, sans-serif;
    }

    .public-leagues-overlay {
      min-height: 100vh;
      padding: 30px 20px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      box-sizing: border-box;
      background:
        radial-gradient(circle at 18% 0%, rgba(240, 215, 134, 0.14), transparent 32%),
        linear-gradient(135deg, rgba(0, 0, 0, 0.36), rgba(0, 0, 0, 0.62));
    }

    .public-leagues-card {
      width: min(1120px, 94vw);
      padding: 24px;
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(17, 19, 24, 0.88), rgba(4, 5, 8, 0.82));
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 22px 56px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(4px) saturate(1.08);
      box-sizing: border-box;
    }

    .public-leagues-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: end;
      padding-bottom: 18px;
      margin-bottom: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .public-leagues-kicker {
      margin: 0 0 6px;
      color: #d9bd65;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }

    .public-leagues-title {
      margin: 0;
      color: #ffffff;
      font-size: clamp(34px, 5vw, 52px);
      font-weight: 800;
      letter-spacing: 1.6px;
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.58);
    }

    #publicLeaguesSubtitle {
      max-width: 700px;
      margin: 10px 0 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.45;
    }

    .public-leagues-links {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .public-leagues-link,
    .public-join-button,
    .public-empty-link {
      min-height: 44px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.20);
      background: linear-gradient(to bottom, #2a2d34, #111319);
      color: #ffffff;
      font-family: "Oxanium", Arial, sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.7px;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.10),
        0 8px 18px rgba(0, 0, 0, 0.24);
      cursor: pointer;
      box-sizing: border-box;
    }

    .public-leagues-link.gold,
    .public-join-button,
    .public-empty-link {
      background: linear-gradient(to bottom, #dfc15f, #b5852d);
      border-color: rgba(255, 236, 159, 0.52);
      color: #191b21;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.42);
    }

    .public-leagues-link:hover,
    .public-join-button:hover,
    .public-empty-link:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    .public-toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(180px, 240px);
      gap: 12px;
      margin-bottom: 18px;
    }

    .public-search-input,
    .public-sort-select {
      width: 100%;
      min-height: 48px;
      padding: 0 14px;
      border-radius: 7px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-family: "Oxanium", Arial, sans-serif;
      font-size: 14px;
      font-weight: 800;
      outline: none;
      box-sizing: border-box;
    }

    .public-search-input::placeholder {
      color: rgba(255, 255, 255, 0.42);
    }

    .public-directory-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .public-league-card,
    .public-empty-state {
      position: relative;
      overflow: hidden;
      padding: 18px;
      border-radius: 10px;
      background: linear-gradient(145deg, rgba(32, 35, 42, 0.86), rgba(13, 15, 20, 0.90));
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 12px 30px rgba(0, 0, 0, 0.24);
      box-sizing: border-box;
    }

    .public-league-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 5px;
      background: linear-gradient(to bottom, #d9bd65, rgba(128, 137, 150, 0.74));
    }

    .public-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
    }

    .public-league-name {
      margin: 0;
      color: #ffffff;
      font-size: 25px;
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: 0.4px;
    }

    .public-league-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .public-pill,
    .public-discord-link {
      min-height: 27px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.13);
      color: rgba(255, 255, 255, 0.78);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      text-decoration: none;
    }

    .public-pill.open {
      background: rgba(217, 189, 101, 0.16);
      border-color: rgba(217, 189, 101, 0.30);
      color: #ead68b;
    }

    .public-discord-link {
      color: #9fc8ff;
    }

    .public-description {
      min-height: 68px;
      margin: 0 0 14px;
      color: rgba(255, 255, 255, 0.76);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
    }

    .public-meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px;
      margin-bottom: 14px;
    }

    .public-meta-item {
      padding: 10px;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.10);
    }

    .public-meta-item span {
      display: block;
      color: rgba(255, 255, 255, 0.48);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .public-meta-item strong {
      display: block;
      margin-top: 5px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
    }

    .public-card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.10);
    }

    .public-card-note {
      margin: 0;
      color: rgba(255, 255, 255, 0.56);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
    }

    .public-join-button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
      filter: grayscale(0.2);
      transform: none;
    }

    .public-empty-state {
      grid-column: 1 / -1;
      text-align: center;
    }

    .public-empty-state p {
      margin: 8px 0 16px;
      color: rgba(255, 255, 255, 0.74);
      font-size: 15px;
      font-weight: 700;
    }

    #publicLeaguesStatus {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.34);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.78);
      text-align: center;
      font-size: 13px;
      font-weight: 800;
    }

    body.league-light-mode.public-leagues-theme-page {
      background-color: #c8cdd4;
      background-image:
        linear-gradient(rgba(238, 241, 245, 0.34), rgba(134, 142, 153, 0.30)),
        url("images/backgrounds/VictoryRoad.png");
    }

    body.league-light-mode.public-leagues-theme-page .public-leagues-overlay {
      background:
        radial-gradient(circle at 18% 0%, rgba(255, 238, 176, 0.20), transparent 30%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.22), rgba(210, 216, 225, 0.18) 48%, rgba(78, 86, 98, 0.14));
    }

    body.league-light-mode.public-leagues-theme-page .public-leagues-card {
      background:
        linear-gradient(145deg, rgba(248, 250, 252, 0.76), rgba(205, 212, 222, 0.64));
      border-color: rgba(255, 255, 255, 0.64);
      color: #23262b;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.58),
        0 20px 52px rgba(44, 50, 60, 0.24);
      backdrop-filter: blur(3px) saturate(1.08);
    }

    body.league-light-mode.public-leagues-theme-page .public-leagues-header {
      border-bottom-color: rgba(35, 38, 43, 0.14);
    }

    body.league-light-mode.public-leagues-theme-page .public-leagues-title,
    body.league-light-mode.public-leagues-theme-page .public-league-name,
    body.league-light-mode.public-leagues-theme-page .public-meta-item strong {
      color: #23262b;
      text-shadow: none;
    }

    body.league-light-mode.public-leagues-theme-page .public-leagues-kicker {
      color: #8a651f;
    }

    body.league-light-mode.public-leagues-theme-page #publicLeaguesSubtitle,
    body.league-light-mode.public-leagues-theme-page .public-description,
    body.league-light-mode.public-leagues-theme-page .public-card-note {
      color: rgba(35, 38, 43, 0.66);
    }

    body.league-light-mode.public-leagues-theme-page .public-league-card,
    body.league-light-mode.public-leagues-theme-page .public-empty-state {
      background:
        linear-gradient(145deg, rgba(232, 235, 239, 0.88), rgba(188, 194, 203, 0.82) 64%, rgba(216, 220, 226, 0.86));
      border-color: rgba(255, 255, 255, 0.46);
      color: #23262b;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.54),
        0 12px 30px rgba(12, 14, 18, 0.22);
    }

    body.league-light-mode.public-leagues-theme-page .public-search-input,
    body.league-light-mode.public-leagues-theme-page .public-sort-select,
    body.league-light-mode.public-leagues-theme-page .public-meta-item,
    body.league-light-mode.public-leagues-theme-page #publicLeaguesStatus {
      background: rgba(35, 38, 43, 0.06);
      border-color: rgba(35, 38, 43, 0.12);
      color: #23262b;
    }

    body.league-light-mode.public-leagues-theme-page .public-search-input::placeholder,
    body.league-light-mode.public-leagues-theme-page .public-meta-item span {
      color: rgba(35, 38, 43, 0.48);
    }

    body.league-light-mode.public-leagues-theme-page .public-pill {
      background: rgba(35, 38, 43, 0.08);
      border-color: rgba(35, 38, 43, 0.12);
      color: rgba(35, 38, 43, 0.70);
    }

    body.league-light-mode.public-leagues-theme-page .public-pill.open {
      background: rgba(176, 124, 40, 0.17);
      border-color: rgba(176, 124, 40, 0.26);
      color: #6f4a16;
    }

    body.league-light-mode.public-leagues-theme-page .public-discord-link {
      background: rgba(45, 103, 174, 0.11);
      border-color: rgba(45, 103, 174, 0.18);
      color: #285d9a;
    }

    @media (max-width: 900px) {
      .public-leagues-header,
      .public-toolbar,
      .public-directory-grid {
        grid-template-columns: 1fr;
      }

      .public-leagues-links {
        justify-content: flex-start;
      }
    }

    @media (max-width: 620px) {
      .public-leagues-overlay {
        padding: 20px 12px;
      }

      .public-leagues-card {
        width: 100%;
        padding: 18px;
      }

      .public-leagues-links,
      .public-card-actions {
        display: grid;
        grid-template-columns: 1fr;
      }

      .public-leagues-link,
      .public-join-button,
      .public-empty-link {
        width: 100%;
      }

      .public-meta-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body class="public-leagues-theme-page">
  <div class="public-leagues-overlay">
    <main class="public-leagues-card">
      <header class="public-leagues-header">
        <div>
          <p class="public-leagues-kicker">Public Directory</p>
          <h1 class="public-leagues-title">Public Leagues</h1>
          <p id="publicLeaguesSubtitle">Browse open leagues posted by admins, check the format, and claim an available team slot.</p>
        </div>

        <nav class="public-leagues-links" aria-label="Public league navigation">
          <a class="public-leagues-link" href="account.html">Account</a>
          <a class="public-leagues-link" href="my-leagues.html?v=public-leagues1">My Leagues</a>
          <a class="public-leagues-link gold" href="create-league.html?v=create-league-public1">Create League</a>
        </nav>
      </header>

      <section class="public-toolbar" aria-label="Public league filters">
        <input id="publicLeagueSearch" class="public-search-input" type="search" placeholder="Search public leagues">
        <select id="publicLeagueSort" class="public-sort-select" aria-label="Sort public leagues">
          <option value="newest">Newest First</option>
          <option value="open">Most Open Teams</option>
          <option value="name">League Name</option>
        </select>
      </section>

      <section id="publicLeaguesList" class="public-directory-grid"></section>
      <div id="publicLeaguesStatus">Loading public leagues...</div>
    </main>
  </div>

  <script src="js/theme-settings.js?v=global-theme1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/public-leagues.js?v=public-leagues-roster-cap1"></script>
</body>
</html>
